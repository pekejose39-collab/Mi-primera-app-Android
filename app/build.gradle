// Fichero Gradle del MÓDULO app: configuración de compilación y dependencias.
plugins {
    id 'com.android.application'
}

android {
    namespace 'es.medac.josesoto.gachatrack'
    compileSdk 34

    defaultConfig {
        applicationId "es.medac.josesoto.gachatrack"
        minSdk 24          // Android 7.0 (ver RNF-03)
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
